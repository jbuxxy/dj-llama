# Mirror of .github/workflows/ci.yml. Forgejo runs CI only; releases live on
# GitHub. Action SHAs below MUST stay in sync with their counterparts in the
# GitHub workflow -- Dependabot only updates `.github/`, so manual sync is
# required when bumping the GitHub side. Use the job-name annotations on each
# `uses:` line below to find the matching GitHub step.
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# The oven/bun image ships /usr/local/bun-node-fallback-bin/node -> bun as a
# PATH-tail fallback, so vitest/playwright (node shebangs) silently run under
# Bun and break (e.g. zod v4 import interop). Test jobs install a real Node --
# it lands earlier in PATH and wins -- matching GitHub runners where Node is
# preinstalled.
env:
  NODE_VERSION: v24.18.0
  NODE_SHA256: 55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742

jobs:
  # Fail-closed gate for fork PRs. The primary control is the Forgejo repo
  # setting "Require approval for first-time contributors"; this job is
  # defense-in-depth + visibly logged. Step-level `if:` ensures the job runs
  # trivially on push events so downstream `needs: guard` chains cleanly.
  guard:
    runs-on: docker
    # Reuse the pinned bun image already warm on the runner cache -- cheap and
    # avoids juggling an extra digest in the mirror policy comment.
    container:
      image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    steps:
      - name: Reject fork PRs until approved
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Fork PR from $HEAD_REPO - CI blocked."
            echo "Fork runs must be approved in Forgejo repo settings."
            exit 1
          fi

  lint-typecheck-test:
    needs: guard
    runs-on: docker
    container:
      image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates xz-utils > /dev/null && rm -rf /var/lib/apt/lists/*
      - name: Install Node.js
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/node.tar.xz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
      # mirror: .github/workflows/ci.yml `lint-typecheck-test` -> actions/checkout
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  build:
    runs-on: docker
    container:
      image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    needs: lint-typecheck-test
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null && rm -rf /var/lib/apt/lists/*
      # mirror: .github/workflows/ci.yml `build` -> actions/checkout
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify container build identity
        run: bun run check:docker-identity
        env:
          # Container jobs on this runner do not expose a Docker daemon.
          DJLLAMA_ALLOW_MISSING_DOCKER: "1"

  api-route-test:
    runs-on: docker
    container:
      image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    needs: build
    services:
      postgres:
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djllama_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates xz-utils > /dev/null && rm -rf /var/lib/apt/lists/*
      - name: Install Node.js
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/node.tar.xz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
      # mirror: .github/workflows/ci.yml `api-route-test` -> actions/checkout
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1
      - run: bun install --frozen-lockfile
      - name: Apply PostgreSQL migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@postgres:5432/djllama_test
      - name: Run PostgreSQL session concurrency tests
        run: bunx vitest run tests/db/session-queries.test.ts
        env:
          DATABASE_URL: postgresql://test:test@postgres:5432/djllama_test
      - name: Run API route contract tests
        run: bun run test:api-routes
        env:
          DATABASE_URL: postgresql://test:test@postgres:5432/djllama_test

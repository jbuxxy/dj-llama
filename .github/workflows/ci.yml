name: CI
# Runs on every push and pull request, and is called by docker-publish.yml so
# an image is only ever published from a commit that passes. Uses
# `pull_request` (never `pull_request_target`): a fork's PR runs with a
# read-only token and no repository secrets.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when docker-publish.yml calls this, so
# the standalone run and the publish run's CI don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djllama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway CI database; the DB-backed suites create and drop their own
      # per-test databases on this server.
      DATABASE_URL: postgresql://test:test@localhost:5432/djllama_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - name: Test with coverage
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee vitest.log
      # Job logs need a token to read; annotations are public, so surface what
      # went wrong there: coverage totals, failing tests and unhandled errors,
      # and the end of the run.
      - name: Report test failure
        if: failure()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            jq -r '.total | "::error title=Coverage::lines \(.lines.pct)%, functions \(.functions.pct)%, branches \(.branches.pct)%, statements \(.statements.pct)%"' coverage/coverage-summary.json
          fi
          [ -f vitest.log ] || exit 0
          # Annotation messages are one line; %0A is a newline in them.
          annotate() { sed -e 's/\x1b\[[0-9;]*m//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          clean() { sed -e 's/\x1b\[[0-9;]*m//g' vitest.log; }
          # Vitest's summary and threshold errors (the run's verdict).
          echo "::error title=Test summary::$(clean | grep -E 'Test Files |Tests  |Errors  |ERROR:|exited with code' | annotate)"
          # The failed-test / unhandled-error sections, up to the summary.
          echo "::error title=Failed tests::$(clean | awk '/Failed Tests|Unhandled Error|Unhandled Rejection|^ *FAIL /{p=1} p{print} /Test Files /{exit}' | head -80 | annotate)"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify container build identity
        run: bun run check:docker-identity

  api-route-test:
    runs-on: ubuntu-24.04
    needs: build
    services:
      postgres:
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djllama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Apply PostgreSQL migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/djllama_test
      - name: Run PostgreSQL session concurrency tests
        run: bunx vitest run tests/db/session-queries.test.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/djllama_test
      - name: Run API route contract tests
        run: bun run test:api-routes
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/djllama_test

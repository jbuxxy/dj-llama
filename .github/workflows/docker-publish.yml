name: Build and publish Docker image

on:
  push:
    branches: [main]
    # A release: tagging a commit vYYYY.M.N publishes it as :YYYY.M.N and
    # :stable on top of the :latest every push to main already gets.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest (what an always-current deploy pulls); a vX tag ->
      # :X + :stable (what a self-hoster pins to). Both also get :<sha>.
      # The channel decides whether the footer shows the commit beside the
      # version (src/version.ts): main builds sit between releases, so they do.
      # The version comes from the tag (main builds: the latest release's),
      # not package.json -- the nightly release (release.yml) only tags.
      - id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=$img:${GITHUB_REF#refs/tags/v},$img:stable,$img:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$img:latest,$img:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: |
            DJLLAMA_GIT_SHA=${{ github.sha }}
            DJLLAMA_CHANNEL=${{ steps.tags.outputs.channel }}
            DJLLAMA_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

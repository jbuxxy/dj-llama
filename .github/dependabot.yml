version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # init, analyze and upload-sarif must stay on the same CodeQL version.
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: monthly

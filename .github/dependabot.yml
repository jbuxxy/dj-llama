version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # jsdom 30 breaks vitest 5's jsdom environment ("'addEventListener'
      # called on an object that is not a valid instance of EventTarget" in
      # catchWindowErrors), so every web test fails to start. Drop this once
      # a vitest release supports it.
      - dependency-name: jsdom
        versions: [">=30"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # init, analyze and upload-sarif must stay on the same CodeQL version.
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: monthly

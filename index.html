<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Matches the app's actual background (index.css --color-bg), not the
         bright green accent -- the accent as theme-color tinted the iOS
         status-bar/toolbar area a visible green wash, which read as the
         same "blur" complaint even after the translucent-overlay and
         safe-area fixes above. Two tags (not one dynamic value) since
         theme-color only supports a static per-media-query value; this
         tracks system light/dark, not the in-app theme toggle override. -->
    <meta name="theme-color" content="#f4f9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black-translucent" draws the status bar as an overlay that blurs
         whatever's directly behind it -- with the nav bar's green buttons
         sitting right at the top edge, that blur visibly bled their color
         up into the status bar on a home-screen install. "default" gives
         iOS a normal opaque status bar that pushes page content down below
         it instead, trading a little edge-to-edge immersion for not having
         page content rendered (and blurred) under the status bar at all. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <title>DJ Llama</title>
  </head>
  <body>
    <script>
      // Apply theme before React mounts to prevent FOUC
      (() => {
        var m = localStorage.getItem('djllama-theme') || 'system';
        var resolved = m === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : m;
        document.documentElement.setAttribute('data-theme', `djllama-${resolved}`);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
